addEventListener('beforeinstallprompt',e=>{e.preventDefault();INSTALL=e;if(S)render()});
addEventListener('appinstalled',()=>{INSTALL=null;toast('¡App instalada! 🌸');if(S)render()});
async function appInstall(){if(!INSTALL)return installHelp();INSTALL.prompt();await INSTALL.userChoice;INSTALL=null;if(S)render()}
function installHelp(){modal(`<h2>Instalar la app 📲</h2>${isIOS?'<p>En iPhone:</p><ol><li>Abre esta página en <b>Safari</b>.</li><li>Pulsa el botón <b>Compartir</b> (el cuadrado con la flecha hacia arriba).</li><li>Elige <b>«Añadir a pantalla de inicio»</b>.</li><li>Abre <b>Mi Agenda</b> desde el icono nuevo.</li></ol>':'<p>En Android (Chrome): abre el menú <b>⋮</b> y elige <b>«Instalar aplicación»</b> o <b>«Añadir a pantalla de inicio»</b>.</p><p>En el ordenador (Chrome o Edge): pulsa el icono de instalar que aparece a la derecha de la barra de direcciones.</p>'}<div class="bar" style="margin:16px 0 0"><button class="btn main" onclick="closeM()">Entendido</button></div>`)}
async function pushSave(sub){const j=sub.toJSON();return sb.from('push_subscriptions').upsert({user_id:U.id,endpoint:j.endpoint,p256dh:j.keys.p256dh,auth:j.keys.auth,user_agent:navigator.userAgent.slice(0,200)},{onConflict:'endpoint'})}
async function pushEnable(){
 if(!pushOK())return isIOS&&!isApp()?installHelp():toast('Este navegador no admite notificaciones');
 if(isIOS&&!isApp())return installHelp();
 const perm=await Notification.requestPermission();
 if(perm!=='granted'){toast(perm==='denied'?'Las notificaciones están bloqueadas: actívalas en los ajustes del navegador o del móvil':'No se activaron las notificaciones');return}
 try{if(!SWREG){SWREG=await navigator.serviceWorker.register('sw.js');await navigator.serviceWorker.ready}
  let sub=await SWREG.pushManager.getSubscription();
  if(!sub)sub=await SWREG.pushManager.subscribe({userVisibleOnly:true,applicationServerKey:b64u(VAPID)});
  const r=await pushSave(sub);if(r.error)throw r.error;
  PUSH_ON=true;closeM();render();toast('🔔 Notificaciones activadas en este dispositivo');pushTest(true)
 }catch(e){toast('No se pudieron activar: '+(e.message||e))}}
async function pushTest(quiet){try{const {data,error}=await sb.functions.invoke('send-push',{body:{}});if(error||!data||!data.sent)throw error||new Error('sin envío');if(!quiet)toast('Aviso de prueba enviado 📨')}catch(e){if(!quiet)toast('No se pudo enviar la prueba')}}
async function pushForget(){try{if(!SWREG)return;const sub=await SWREG.pushManager.getSubscription();if(!sub)return;await sb.from('push_subscriptions').delete().eq('endpoint',sub.endpoint);await sub.unsubscribe();PUSH_ON=false}catch{}}
async function pushDisable(){await pushForget();closeM();render();toast('Notificaciones desactivadas en este dispositivo')}
function pushBox(){
 const st=PUSH_ON?'<div class="sub">✅ Este dispositivo recibe avisos: 3 días antes, el mismo día y 30 minutos antes (según tus ajustes de arriba).</div><div class="bar" style="margin:8px 0 0"><button class="btn" type="button" onclick="pushTest()">Enviar aviso de prueba</button><button class="btn del" type="button" onclick="pushDisable()">Desactivar aquí</button></div>'
 :isIOS&&!isApp()?'<div class="sub">En iPhone, primero instala la app en la pantalla de inicio y ábrela desde el icono. Después activa los avisos aquí.</div><div class="bar" style="margin:8px 0 0"><button class="btn main" type="button" onclick="installHelp()">Cómo instalarla</button></div>'
 :!pushOK()?'<div class="sub">Este navegador no admite notificaciones. Prueba con Chrome, Edge o Safari (iPhone, instalada como app).</div>'
 :'<div class="sub">Recibe tus recordatorios como notificación en el móvil u ordenador, aunque la app esté cerrada.</div><div class="bar" style="margin:8px 0 0"><button class="btn main" type="button" onclick="pushEnable()">🔔 Activar notificaciones aquí</button></div>';
 return `<label style="margin-top:14px">Notificaciones en este dispositivo</label>${st}${!isApp()?`<div class="bar" style="margin:8px 0 0"><button class="btn" type="button" onclick="${INSTALL?'appInstall()':'installHelp()'}">📲 Instalar como app</button></div>`:''}`}
function pushBanner(){if(PUSH_ON||pushHide()||(!pushOK()&&!isIOS))return'';
 const ios=isIOS&&!isApp();
 return `<div class="card" style="display:flex;gap:12px;align-items:center;flex-wrap:wrap;border-color:var(--pink)"><div style="font-size:1.8rem">🔔</div><div style="flex:1;min-width:180px"><b>${ios?'Instala Mi Agenda en tu iPhone':'Activa los avisos en este dispositivo'}</b><div class="sub">${ios?'Así podrás recibir tus recordatorios como notificación.':'Te avisaré de tus compromisos aunque tengas la app cerrada.'}</div></div><button class="btn main" onclick="${ios?'installHelp()':'pushEnable()'}">${ios?'Cómo hacerlo':'Activar'}</button><button class="x" onclick="try{localStorage.setItem('ag_pushhide','1')}catch{};render()" aria-label="Ocultar">✕</button></div>`}
swInit();

bgInit();
boot();
</script></body></html>
